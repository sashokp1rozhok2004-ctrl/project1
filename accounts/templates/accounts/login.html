<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход в систему</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        .description {
            margin: 0 0 30px;
            color: #6b7280;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        .button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .error-message {
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 9px;
            background: #fee2e2;
            color: #991b1b;
            line-height: 1.4;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #4b5563;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Вход в систему</h1>

        <p class="description">
            Введите логин и пароль для доступа к приложению.
        </p>

        {% if form.errors %}
            <div class="error-message">
                Неверный логин или пароль. Проверьте данные и попробуйте ещё раз.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">
                    Логин
                </label>

                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">
                    Пароль
                </label>

                {{ form.password }}
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="button">
                Войти
            </button>
        </form>

        <a href="{% url 'accounts:home' %}" class="back-link">
            Вернуться на главную
        </a>
    </main>
</body>
</html>
